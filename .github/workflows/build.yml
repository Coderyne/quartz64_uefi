name: build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions UI

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            iasl \
            device-tree-compiler \
            python3-pyelftools \
            uuid-dev

      - name: Build
        run: |
          make sdcard BOARDS=ZERO-3W

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: uefi-images
          path: ./*_EFI.img
          if-no-files-found: error
